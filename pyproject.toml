[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-analyzer"
version = "0.1.0"
description = "AI-powered medical image analysis with Streamlit and OpenAI"
requires-python = ">=3.10"
dependencies = [
    "agno==1.6.0",
    "streamlit==1.42.0",
    "openai==1.70.0",
    "Pillow==11.1.0",
    "pydicom==3.0.1",
    "numpy==2.2.3",
    "markdown==3.7",
    "python-dotenv==1.0.1",
    "pydantic==2.11.0",
]

[project.optional-dependencies]
pdf = ["fpdf2==2.8.3"]


[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # Line length handled by formatter
    "UP006", # Keep List/Dict typing style consistent
    "UP007", # Keep Union[...] / Optional[...] style
    "UP035", # Keep typing.Dict / typing.List imports
    "UP045", # Keep Optional[X] instead of X | None
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["agents", "config", "dicom_utils", "export", "models", "ui", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
